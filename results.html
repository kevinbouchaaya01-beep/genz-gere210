<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live classroom results</title><style> *{box-sizing:border-box}body{font:17px system-ui;background:linear-gradient(120deg,#ffd1e2,#fff9f1,#dcd0ff);color:#24213d;margin:0}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.05em}section,article{background:#fffdf9;border:2px solid #24213d;border-radius:20px;padding:20px;margin:16px 0;box-shadow:4px 4px #24213d}input,button{font:inherit;padding:12px;border:2px solid #24213d;border-radius:12px;margin:5px}button{background:#d8f68b;cursor:pointer}input{max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.bar{background:#eee4ff;border-radius:12px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:#6746b5}.metric{font-size:42px;font-weight:800;color:#6746b5}small{color:#6746b5;font-weight:bold}</style><main><small>GERE 210 · DR. RANIA SKAILY</small><h1>Our classroom, decoded.</h1><p>Kevin Bou Chaaya &amp; Christina Elias · Live results</p><section id="login"><form id="form"><label>Email <input id="email" type="email" required></label><label>Password <input id="password" type="password" required></label><button>Presenter sign in</button></form></section><p id="status" role="status"></p><div id="panel" hidden><button id="logout">Sign out</button><button id="reset">Reset responses</button><div class="grid"><article>Participants<div class="metric" id="count">0</div></article><article><strong>Class discussion</strong><p>When someone gives an instruction, what makes it easier to hear?</p></article></div><div class="grid" id="questions"></div></div><p>These totals cover questions 1–8. Questions 9 and 10 are for class discussion.</p></main><script type="module">import {auth,db,signInWithEmailAndPassword,signOut,onAuthStateChanged,ref,onValue,remove} from './firebase.js?v=2';import { scenes,
