<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live classroom results</title><style> *{box-sizing:border-box}body{font:17px system-ui;background:linear-gradient(120deg,#ffd1e2,#fff9f1,#dcd0ff);color:#24213d;margin:0}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.05em}section,article{background:#fffdf9;border:2px solid #24213d;border-radius:20px;padding:20px;margin:16px 0;box-shadow:4px 4px #24213d}input,button{font:inherit;padding:12px;border:2px solid #24213d;border-radius:12px;margin:5px}button{background:#d8f68b;cursor:pointer}input{max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.bar{background:#eee4ff;border-radius:12px;height:14px;overflow:hidden}.bar i{display:block;height:100%;background:#6746b5}.metric{font-size:42px;font-weight:800;color:#6746b5}small{color:#6746b5;font-weight:bold}</style><main><small>GERE 210 · DR. RANIA SKAILY</small><h1>Our classroom, decoded.</h1><p>Kevin Bou Chaaya &amp; Christina Elias · Live results</p><section id="login"><form id="form"><label>Email <input id="email" type="email" required></label><label>Password <input id="password" type="password" required></label><button>Presenter sign in</button></form></section><p id="status" role="status"></p><div id="panel" hidden><button id="logout">Sign out</button><button id="reset">Reset responses</button><div class="grid"><article>Participants<div class="metric" id="count">0</div></article><article>Average playful alignment<div class="metric" id="average">—</div></article></div><section id="profiles"></section><div class="grid" id="questions"></div></div><p>For classroom discussion only; not a scientific personality or age assessment.</p></main><script type="module">import {auth,db,signInWithEmailAndPassword,signOut,onAuthStateChanged,ref,onValue,remove} from './firebase.js?v=2';const qs=[['Someone sends you “okay.”',['I read it literally','I check the context','I wonder whether they are upset']],['A friend is having a rough day.',['Offer practical help','Ask how they want to be supported','Send a relatable meme, then check in']],['A rule seems unfair.',['Follow it for now','Ask privately for an explanation','Discuss the reasoning openly']],['An awkward moment happens.',['Move on quietly','Talk about it','Make a light joke to ease tension']],['Before sending an important message…',['Send it once it is clear','Reread it once','Rewrite it several times']],['You disagree with someone older.',['Avoid the debate','Explain my view if invited','Ask questions and share my perspective']],['A friend says something hurtful as a joke.',['Let it pass','Ask what they meant','Explain how it landed and set a boundary']],['A serious conversation starts.',['Keep it formal','Adapt to the situation','Start casually, then get serious when needed']]];const $=id=>document.getElementById(id);const uid='ozn5rEOoP6OsICcam080fkhEbaA2';let stop;const path=ref(db,'responses');$('form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value='';}catch(e){$('status').textContent=e.message;}};$('logout').onclick=()=>signOut(auth);$('reset').onclick=async()=>{if(confirm('Permanently delete all classroom responses?'))try{await remove(path)}catch(e){$('status').textContent=e.message}};function bar(label,n,total){const p=total?Math.round(n/total*100):0;return '<p>'+label+' — '+p+'% ('+n+')</p><div class="bar"><i style="width:'+p+'%"></i></div>'}function render(snapshot){const rows=Object.values(snapshot.val()||{}).filter(x=>x&&qs.every((_,i)=>Number.isInteger(x['q'+i])&&x['q'+i]>=0&&x['q'+i]<=2));const n=rows.length;const scores=rows.map(x=>Math.round(qs.reduce((s,_,i)=>s+x['q'+i],0)/16*100));$('count').textContent=n;$('average').textContent=n?Math.round(scores.reduce((a,b)=>a+b,0)/n)+'%':'—';$('profiles').innerHTML='<h2>Communication profiles</h2>'+bar('Expressive connector',scores.filter(s=>s>=70).length,n)+bar('Generation bridge',scores.filter(s=>s>=40&&s<70).length,n)+bar('Straightforward communicator',scores.filter(s=>s<40).length,n);$('questions').innerHTML=qs.map(([question,answers],i)=>'<article><small>QUESTION '+(i+1)+'</small><h3>'+question+'</h3>'+answers.map((a,j)=>bar(a,rows.filter(x=>x['q'+i]===j).length,n)).join('')+'</article>').join('');$('status').textContent='Listening for live responses.'}onAuthStateChanged(auth,u=>{if(stop){stop();stop=null}$('panel').hidden=true;$('login').hidden=false;$('status').textContent='';if(!u)return;if(u.uid!==uid){$('status').textContent='Presenter account required.';return}$('panel').hidden=false;$('login').hidden=true;stop=onValue(path,render,e=>{$('status').textContent=e.message})});</script></html>
